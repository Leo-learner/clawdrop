<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f7f4">
  <title>ClawDrop</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <section id="login-view" class="login-view" aria-labelledby="login-title">
      <div class="login-card">
        <div class="brand brand-login">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <span>ClawDrop</span>
        </div>
        <h1 id="login-title">打开私有文件箱</h1>
        <p class="login-copy">输入管理 token，查看、上传、预览和管理私人云文件。</p>
        <form id="login-form">
          <input class="visually-hidden" type="text" name="username" value="admin" autocomplete="username" tabindex="-1" aria-hidden="true" hidden>
          <label for="admin-token">ADMIN_TOKEN</label>
          <div class="token-row">
            <input id="admin-token" name="token" type="password" autocomplete="current-password" required placeholder="输入管理 token">
            <button class="button button-primary" type="submit">进入文件箱</button>
          </div>
          <p class="privacy-note">Token 只保存在当前浏览器的 localStorage 中。</p>
          <p id="login-error" class="form-error" role="alert" hidden></p>
        </form>
      </div>
    </section>

    <section id="app-view" class="app-view" hidden aria-labelledby="files-title">
      <header class="app-header">
        <div class="brand-group">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true"><span></span></span>
            <span>ClawDrop</span>
          </div>
          <span class="brand-divider" aria-hidden="true"></span>
          <span class="subtitle">轻量私人云文件传输</span>
        </div>
        <div class="header-actions">
          <button id="refresh-button" class="button button-quiet" type="button">↻ <span>刷新</span></button>
          <button id="logout-button" class="button button-quiet" type="button">↪ <span>退出</span></button>
        </div>
      </header>

      <section class="content">
        <div class="content-heading">
          <h1 id="files-title">文件</h1>
          <p id="file-count" class="file-count"></p>
        </div>
        <section class="upload-panel" aria-labelledby="upload-title">
          <div>
            <h2 id="upload-title">上传文件</h2>
            <p id="rate-limit-status" class="rate-limit-status">当前下载限速：100 KB/s</p>
          </div>
          <form id="upload-form" class="upload-form">
            <label class="file-picker" for="file-upload">
              <span>选择文件</span>
              <input id="file-upload" name="file" type="file" required>
            </label>
            <button id="upload-button" class="button button-primary" type="submit">上传</button>
            <div id="upload-progress-wrap" class="upload-progress-wrap" hidden>
              <progress id="upload-progress" value="0" max="100"></progress>
              <span id="upload-progress-text">0%</span>
            </div>
            <p id="upload-status" class="upload-status" role="status" hidden></p>
          </form>
        </section>
        <div id="download-progress-wrap" class="download-progress-wrap" hidden>
          <div class="download-progress-header">
            <span id="download-progress-title">正在下载…</span>
            <span id="download-progress-percent">0%</span>
          </div>
          <progress id="download-progress" value="0" max="100"></progress>
          <p id="download-progress-detail">0 B / 0 B</p>
          <p id="download-progress-status" class="download-progress-status" role="status">准备下载</p>
        </div>
        <div class="file-tools">
          <label class="search-field" for="file-search">
            <span class="visually-hidden">搜索文件</span>
            <input id="file-search" type="search" autocomplete="off" placeholder="搜索文件名或类型">
          </label>
          <div class="filter-group" role="group" aria-label="按文件类型筛选">
            <button class="button filter-button active" type="button" data-filter="all" aria-pressed="true">全部</button>
            <button class="button filter-button" type="button" data-filter="image" aria-pressed="false">图片</button>
            <button class="button filter-button" type="button" data-filter="text" aria-pressed="false">文本</button>
            <button class="button filter-button" type="button" data-filter="pdf" aria-pressed="false">PDF</button>
            <button class="button filter-button" type="button" data-filter="archive" aria-pressed="false">压缩包</button>
            <button class="button filter-button" type="button" data-filter="other" aria-pressed="false">其他</button>
          </div>
        </div>
        <div id="status-message" class="status-message" role="status" hidden></div>
        <div class="file-table" aria-live="polite">
          <div class="file-table-head" aria-hidden="true">
            <span>文件名</span>
            <span>大小</span>
            <span>上传时间</span>
            <span>类型 / 下载</span>
            <span>操作</span>
          </div>
          <div id="file-list" class="file-list"></div>
        </div>
      </section>
    </section>
  </main>

  <dialog id="preview-dialog" class="preview-dialog" aria-labelledby="preview-title">
    <div class="preview-header">
      <div>
        <h2 id="preview-title"></h2>
        <p id="preview-meta" class="preview-meta"></p>
      </div>
      <button id="preview-close" class="icon-button" type="button" aria-label="关闭预览">×</button>
    </div>
    <div id="preview-body" class="preview-body"></div>
    <div class="preview-footer">
      <button id="preview-download" class="button button-primary" type="button">下载文件</button>
    </div>
  </dialog>

  <dialog id="share-dialog" class="share-dialog" aria-labelledby="share-title">
    <div class="preview-header">
      <div>
        <h2 id="share-title">分享文件</h2>
        <p id="share-meta" class="preview-meta"></p>
      </div>
      <button id="share-close" class="icon-button" type="button" aria-label="关闭分享管理">×</button>
    </div>
    <div class="share-body">
      <form id="share-form" class="share-form">
        <label class="share-field" for="share-expires-hours">
          <span>有效期（小时）</span>
          <input id="share-expires-hours" type="number" min="1" max="168" step="1" value="24" required>
        </label>
        <label class="share-field" for="share-max-downloads">
          <span>最大下载次数</span>
          <input id="share-max-downloads" type="number" min="1" max="100" step="1" placeholder="不限">
        </label>
        <button id="share-create" class="button button-primary" type="submit">创建分享链接</button>
      </form>
      <p id="share-error" class="form-error" role="alert" hidden></p>
      <div id="share-result" class="share-result" hidden>
        <span class="share-section-label">新分享链接</span>
        <div class="share-copy-row">
          <input id="share-result-url" type="text" readonly aria-label="新分享链接">
          <button id="share-result-copy" class="button button-secondary" type="button">复制链接</button>
        </div>
      </div>
      <section class="share-list-section" aria-labelledby="share-list-title">
        <div class="share-list-heading">
          <h3 id="share-list-title">已有分享</h3>
          <button id="share-refresh" class="button button-quiet" type="button">刷新</button>
        </div>
        <div id="share-list" class="share-list" aria-live="polite"></div>
      </section>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/app.js" defer></script>
</body>
</html>
